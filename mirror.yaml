# Everything the airgap zone needs from the internet (issue #31): the images
# of the airgap registry, the Helm charts that are not vendored in git, and
# release files. scripts/mirror.py pulls them in the connected zone and
# pushes the images to the registry; scripts/check/image-list.sh checks the
# images against the rendered manifests.
#
# images:
#   source:   where it is pulled from, for `platform`
#   mirror:   its path and tag in the registry, when it is not the source
#             without its registry host (and without library/ for docker.io)
#   build:    built here instead of pulled; no tag on `mirror` means any tag
#   dockerfile: built by mirror.py pull for `platform` from this file, at
#             each pull, and pushed like the pulled images
#   floating: true for a tag that moves upstream (7-alpine); reported
#   used_by:  the file that uses it, for an image no rendered manifest
#             references (install scripts, CI, Ansible); must exist
#   archive:  saved as a docker archive at this path instead of pushed to
#             the registry (loaded with docker load where it runs)
#   digest:   digest of `source` for `platform`, the image the registry
#             holds; the pull fails when the tag points to another one
#   renovate: true when Renovate updates it (renovate.json5), with the
#             files that reference it; keep it right after `digest`. The
#             others follow the chart or vendored manifest that uses them
#
# A manifest may reference an image by its upstream name: K3s mirrors
# docker.io, quay.io, ghcr.io, gcr.io and registry.k8s.io to the airgap
# registry under the same path (03-airgap-zone/config/registries.yaml).
#
# charts, files: downloaded to `dest` under the artifacts directory, checked
# against `sha256`. Charts vendored in 03-airgap-zone/manifests are not
# listed: ArgoCD reads them from git.
registry: 192.168.2.2:5000
platform: linux/arm64
images:
  # Built in this repository
  - mirror: lumen-api
    build: 01-connected-zone/Dockerfile, by .gitea/workflows/ci.yaml
  # Tagged with its Go version: keep it with the GO_BUILDER of the Dockerfile
  - mirror: lumen-api:builder-go1.26.11
    build: the Gitea CI job image
    dockerfile: 01-connected-zone/ci/Dockerfile
    used_by: 03-airgap-zone/manifests/gitea-runner/01-runner.yaml
  - mirror: falcosecurity/k8smeta-plugin:0.4.1

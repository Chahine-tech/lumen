name: Secret scan

# Same scan as .gitea/workflows/secret-scan.yaml, for the public GitHub mirror
# (issue #1): this is where a leak becomes public.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        # actions/checkout pinned by commit (issue #14), its version in the
        # trailing comment (Renovate reads it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo \
            --config /repo/.gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact --no-banner --verbose

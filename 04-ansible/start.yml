---
# start.yml — Start the lumen airgap cluster after a Mac or VM reboot
#
# Usage:
#   ansible-playbook 04-ansible/start.yml
#   ansible-playbook 04-ansible/start.yml --ask-become-pass  # if sudo needs password
#
# What it does:
#   1. Start Multipass VMs (backup-1, then node-1, node-2)
#   2. Wait for K3s nodes to be Ready
#   3. Restore ARP entry for MetalLB VIP (lost on reboot)
#   4. Unseal Vault (includes unseal.yml)

- name: Start Multipass VMs
  hosts: localhost
  gather_facts: false

  tasks:
    # First, so PostgreSQL can archive WAL as soon as it starts
    - name: Start the backup VM (Garage)
      ansible.builtin.command: multipass start backup-1
      changed_when: true

    - name: Start node-1 and node-2
      ansible.builtin.command: multipass start node-1 node-2
      register: start_result
      changed_when: true
      failed_when: start_result.rc != 0

    - name: Wait for K3s API to be reachable
      ansible.builtin.command: kubectl get nodes --no-headers
      register: nodes_status
      until: nodes_status.rc == 0 and 'NotReady' not in nodes_status.stdout
      retries: 30
      delay: 5
      changed_when: false

    - name: Show nodes
      ansible.builtin.debug:
        msg: "{{ nodes_status.stdout_lines }}"

- name: Restore ARP entry for MetalLB VIP
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Get node-1 MAC address
      ansible.builtin.command: >
        multipass exec node-1 -- bash -c
        "cat /sys/class/net/enp0s1/address 2>/dev/null ||
         ip link show | awk '/ether/{print $2; exit}'"
      register: node1_mac
      changed_when: false

    - name: Set ARP entry for MetalLB VIP
      ansible.builtin.command: arp -s {{ metallb_vip }} {{ node1_mac.stdout | trim }}
      become: true
      changed_when: true

    - name: Confirm ARP entry
      ansible.builtin.debug:
        msg: "ARP entry set: {{ metallb_vip }} -> {{ node1_mac.stdout | trim }}"

- name: Unseal Vault
  ansible.builtin.import_playbook: unseal.yml

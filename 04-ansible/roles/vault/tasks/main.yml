---
# Role: vault: Vault's certificates, then wait for the pods to unseal by
# themselves (transit auto-unseal, issue #3). Initialization is a one-time
# operation: 03-airgap-zone/scripts/vault-bootstrap.sh

# Vault's listener certificate (issue #5, docs/runbooks/vault-tls.md): the
# pods wait for it. The intermediate CA is put in the cluster by hand
# (03-airgap-zone/scripts/infra-ca.sh apply): its root key stays offline.
- name: Check the infrastructure CA Secret
  ansible.builtin.command: kubectl get secret infra-ca -n cert-manager
  register: vault_infra_ca
  changed_when: false
  failed_when: false

- name: Fail without the infrastructure CA
  ansible.builtin.fail:
    msg: |
      Secret cert-manager/infra-ca not found: Vault's certificate cannot be issued.
      Run 03-airgap-zone/scripts/infra-ca.sh init, then apply (docs/runbooks/vault-tls.md).
  when: vault_infra_ca.rc != 0

# Retried: cert-manager's CRDs come with its ArgoCD Application
- name: Apply the infrastructure CA issuer and Vault's certificates
  ansible.builtin.command: >-
    kubectl apply
    -f {{ project_root }}/03-airgap-zone/manifests/vault/05-infra-ca.yaml
    -f {{ project_root }}/03-airgap-zone/manifests/vault/06-vault-tls.yaml
  register: vault_tls_apply
  until: vault_tls_apply.rc == 0
  retries: 30
  delay: 10
  changed_when: "'created' in vault_tls_apply.stdout or 'configured' in vault_tls_apply.stdout"

- name: Wait for Vault pods to exist
  ansible.builtin.command: kubectl get pods -n vault --no-headers
  register: vault_pods
  until: vault_pods.rc == 0 and vault_pods.stdout_lines | length >= 3
  retries: 30
  delay: 10
  changed_when: false

- name: Show Vault pod status
  ansible.builtin.debug:
    msg: "{{ vault_pods.stdout_lines }}"

# Auto-unseal through the transit Vault on backup-1 (issue #3): nothing to
# unseal here. A pod that started while the transit Vault was sealed exits,
# and the kubelet restarts it until the transit Vault answers.
- name: Read the Vault status
  ansible.builtin.command: kubectl exec -n {{ vault_namespace }} vault-0 -- vault status -format=json
  register: vault_status
  changed_when: false
  failed_when: false  # exit code 2 when sealed

- name: First start
  ansible.builtin.debug:
    msg: |
      Vault is not initialized. Run 03-airgap-zone/scripts/vault-bootstrap.sh
      (docs/runbooks/vault-auto-unseal.md): it prints the recovery keys once.
  when: '"initialized\": false" in vault_status.stdout'

- name: Wait for every Vault pod to be unsealed
  ansible.builtin.command: >
    kubectl get pods -n {{ vault_namespace }} -l component=server
    -o jsonpath={.items[*].status.containerStatuses[0].ready}
  register: vault_ready
  until: vault_ready.stdout.split() | length == vault_pods | length and 'false' not in vault_ready.stdout
  retries: 40
  delay: 15
  changed_when: false
  when: '"initialized\": false" not in vault_status.stdout'

---
# Role: gitea — Create Gitea org + repo and push the lumen repository
# Gitea serves as the GitOps source for ArgoCD (in-cluster git)

- name: Require the Gitea admin password from the environment
  ansible.builtin.assert:
    that: gitea_admin_password | length > 0
    fail_msg: >-
      GITEA_ADMIN_PASSWORD is not set. Export it from your password manager:
      read -rs GITEA_ADMIN_PASSWORD && export GITEA_ADMIN_PASSWORD
  no_log: true

- name: Wait for Gitea pod to be ready
  ansible.builtin.command: >
    kubectl wait pod -l app=gitea -n gitea
    --for=condition=Ready --timeout=180s
  changed_when: false

- name: Start port-forward to Gitea
  ansible.builtin.command: >
    kubectl port-forward -n gitea svc/gitea {{ gitea_local_port }}:3000
  async: 30
  poll: 0
  register: pf_job

- name: Wait for port-forward to establish
  ansible.builtin.pause:
    seconds: 5

- name: Create Gitea organization 'lumen'
  ansible.builtin.uri:
    url: "http://localhost:{{ gitea_local_port }}/api/v1/orgs"
    method: POST
    user: "{{ gitea_admin_user }}"
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      username: "{{ gitea_org }}"
      full_name: "Lumen Organization"
      description: "Lumen airgap project"
    status_code: [201, 422]  # 422 = already exists
  register: create_org
  no_log: true  # the request carries the admin password

- name: Create Gitea repository 'lumen'
  ansible.builtin.uri:
    url: "http://localhost:{{ gitea_local_port }}/api/v1/orgs/{{ gitea_org }}/repos"
    method: POST
    user: "{{ gitea_admin_user }}"
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ gitea_repo }}"
      description: "Lumen airgap Kubernetes project"
      private: false
      auto_init: false
    status_code: [201, 409]  # 409 = already exists
  register: create_repo
  no_log: true  # the request carries the admin password

# Push straight to the URL: no remote added to the operator's repository (the
# previous version removed the operator's own `gitea` remote), no credentials
# in a URL, .git/config or a command line. GIT_ASKPASS reads them from the
# environment; credential.helper is emptied so nothing lands in a keychain.
- name: Push to Gitea
  ansible.builtin.command: >
    git -C {{ project_root }} -c credential.helper=
    push http://localhost:{{ gitea_local_port }}/{{ gitea_org }}/{{ gitea_repo }}.git main --force
  environment:
    GIT_ASKPASS: "{{ role_path }}/files/git-askpass.sh"
    GIT_TERMINAL_PROMPT: "0"
    GITEA_USER: "{{ gitea_admin_user }}"
    GITEA_PASSWORD: "{{ gitea_admin_password }}"
  changed_when: true
  no_log: true

- name: Stop port-forward
  ansible.builtin.command: pkill -f "kubectl port-forward -n gitea"
  failed_when: false
  changed_when: false

- name: Confirm Gitea ready
  ansible.builtin.debug:
    msg: "Gitea repo: https://gitea.airgap.local/{{ gitea_org }}/{{ gitea_repo }}"

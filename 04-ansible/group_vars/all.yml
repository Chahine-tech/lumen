---
# Lumen airgap cluster — global variables
# All versions, IPs, credentials, and paths in one place

# ──────────────────────────────────────────────────────────────────────────────
# Cluster topology
# ──────────────────────────────────────────────────────────────────────────────
node1_ip: "192.168.2.2"
node2_ip: "192.168.2.3"
node1_name: "node-1"
node2_name: "node-2"

# ──────────────────────────────────────────────────────────────────────────────
# K3s
# ──────────────────────────────────────────────────────────────────────────────
k3s_version: "v1.28.5+k3s1"

# ──────────────────────────────────────────────────────────────────────────────
# Registry
# ──────────────────────────────────────────────────────────────────────────────
registry_host: "192.168.2.2"
registry_port: 5000
registry_url: "192.168.2.2:5000"

# ──────────────────────────────────────────────────────────────────────────────
# Backup target: Garage (S3) on backup-1, outside the K3s cluster
# Receives the PostgreSQL backups (CloudNativePG Barman Cloud plugin)
# ──────────────────────────────────────────────────────────────────────────────
backup_vm_name: "backup-1"
backup_ip: "192.168.2.4"
garage_version: "v2.5.0"
garage_image: "dxflrs/garage:{{ garage_version }}"
garage_container: "garage"
garage_s3_region: "garage"
garage_bucket: "lumen-pg-backups"
garage_key_name: "lumen-cnpg-backup"
# Bucket and key per user: the PostgreSQL backups, the Vault Raft snapshots
# (issue #4, manifests/vault/07-raft-snapshot.yaml)
garage_buckets:
  - bucket: "{{ garage_bucket }}"
    key: "{{ garage_key_name }}"
  - bucket: "lumen-vault-snapshots"
    key: "lumen-vault-snapshot"

# Transit Vault on backup-1: unseals the cluster's Vault (issue #3)
vault_transit_version: "1.19.0"
vault_transit_image: "hashicorp/vault:{{ vault_transit_version }}"
vault_transit_container: "vault-transit"
vault_transit_port: 8200

# Infrastructure CA directory on the operator's workstation
# (03-airgap-zone/scripts/infra-ca.sh, issue #5)
infra_ca_dir: "{{ lookup('env', 'HOME') }}/.lumen-pki"

# ──────────────────────────────────────────────────────────────────────────────
# MetalLB
# ──────────────────────────────────────────────────────────────────────────────
metallb_vip: "192.168.2.100"
metallb_version: "0.15.3"

# ──────────────────────────────────────────────────────────────────────────────
# Vault
# ──────────────────────────────────────────────────────────────────────────────
vault_namespace: "vault"
vault_pods:
  - vault-0
  - vault-1
  - vault-2


# ──────────────────────────────────────────────────────────────────────────────
# Gitea
# ──────────────────────────────────────────────────────────────────────────────
gitea_admin_user: "gitea-admin"
# Never in this file (public repository, issue #1): exported by the operator
# from a password manager before running the gitea role:
#   read -rs GITEA_ADMIN_PASSWORD && export GITEA_ADMIN_PASSWORD
gitea_admin_password: "{{ lookup('ansible.builtin.env', 'GITEA_ADMIN_PASSWORD') }}"
gitea_org: "lumen"
gitea_repo: "lumen"
gitea_local_port: 3001  # port-forward local port

# ──────────────────────────────────────────────────────────────────────────────
# ArgoCD Applications (sync-wave order)
# ──────────────────────────────────────────────────────────────────────────────
argocd_namespace: "argocd"
argocd_apps:
  - "04-application-lumen.yaml"
  - "05-application-monitoring-config.yaml"
  - "06-application-network-policies.yaml"
  - "07-application-traefik.yaml"
  - "08-application-kube-prometheus.yaml"
  - "09-application-loki.yaml"
  - "10-application-alloy.yaml"
  - "12-application-tempo.yaml"
  - "13-application-vault.yaml"
  - "14-application-cert-manager.yaml"
  - "15-application-vso.yaml"
  - "16-application-falco.yaml"
  - "17-application-argo-rollouts.yaml"
  - "18-application-chaos-mesh.yaml"
  - "19-application-kyverno.yaml"           # admission controller
  - "20-application-kyverno-policies.yaml"  # registry, tags, labels, resources, signatures
  - "21-application-vso-config.yaml"
  - "22-application-strimzi.yaml"            # Kafka operator (issue #44)
  - "23-application-kafka.yaml"

# ──────────────────────────────────────────────────────────────────────────────
# DNS — airgap domains (all resolve to MetalLB VIP)
# ──────────────────────────────────────────────────────────────────────────────
airgap_domains:
  - "lumen-api.airgap.local"
  - "vault.airgap.local"
  - "argocd.airgap.local"
  - "gitea.airgap.local"
  - "grafana.airgap.local"
  - "prometheus.airgap.local"
  - "alertmanager.airgap.local"
  - "traefik.airgap.local"
  - "tempo.airgap.local"

# ──────────────────────────────────────────────────────────────────────────────
# Paths (relative to playbook_dir = 04-ansible/)
# ──────────────────────────────────────────────────────────────────────────────
project_root: "{{ playbook_dir }}/.."
manifests_dir: "{{ project_root }}/03-airgap-zone/manifests"
argocd_apps_dir: "{{ manifests_dir }}/argocd"
ca_cert_path: "{{ project_root }}/03-airgap-zone/airgap-ca.crt"

# Multipass VM specs
node1_cpus: 4
node1_memory: "6G"
node1_disk: "40G"
node2_cpus: 2
node2_memory: "4G"
node2_disk: "30G"

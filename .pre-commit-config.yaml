# Local secret scan before each commit (issue #1)
# Setup: brew install gitleaks pre-commit && pre-commit install
# The "system" hook uses the local gitleaks binary (the docker variant of the
# upstream hooks pulls an unversioned image).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system

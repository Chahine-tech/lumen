version: '3.8'

# Images by index digest (issue #31): the tag each one pointed to on
# 16 November 2026 (registry:2, joxit/docker-registry-ui:latest,
# nginx:alpine).
services:
  # Simple Docker Registry
  registry:
    image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    container_name: transit-registry
    ports:
      - "5000:5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
      - ./config/registry-config.yml:/etc/docker/registry/config.yml
    networks:
      - transit-net
    restart: unless-stopped

  registry-ui:
    image: joxit/docker-registry-ui:2.6.0@sha256:bb5956a6b378706f1c3a92c947d0a0c606e280460cd9e37c0198caf46399c839
    container_name: transit-registry-ui
    ports:
      - "8081:80"
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=Airgap Transit Registry
      - REGISTRY_URL=http://registry:5000
      - DELETE_IMAGES=true
      - SHOW_CONTENT_DIGEST=true
    depends_on:
      - registry
    networks:
      - transit-net
    restart: unless-stopped

  # Nginx
  fileserver:
    image: nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    container_name: transit-fileserver
    ports:
      - "8082:80"
    volumes:
      - ../artifacts:/usr/share/nginx/html:ro
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - transit-net
    restart: unless-stopped

networks:
  transit-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  registry-data:

name: Secret scan

# Full-history gitleaks scan on every push and pull request (issue #1).
# Known historical findings are listed in .gitleaksignore; anything else fails.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: 192.168.2.2:5000

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          github-server-url: http://192.168.2.2:30300
          fetch-depth: 0

      - name: Scan
        run: |
          # Image mirrored by 01-connected-zone/scripts/22-pull-gitleaks.sh
          # + 02-transit-zone/push-gitleaks.sh
          docker run --rm -v "$PWD:/repo" \
            ${{ env.REGISTRY }}/gitleaks/gitleaks:v8.30.1 \
            git /repo \
            --config /repo/.gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact --no-banner --verbose

name: Secret scan

# Full-history gitleaks scan on every push and pull request (issue #1).
# Known historical findings are listed in .gitleaksignore; anything else fails.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: 192.168.2.2:5000

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      # Not actions/checkout: an airgap runner cannot fetch it from github.com
      # (issue #31). Every branch and tag (gitleaks scans the whole history),
      # with the job token, which is not kept in .git/config
      - name: Checkout (full history)
        env:
          SERVER: http://192.168.2.2:30300
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "${SERVER}/${GITHUB_REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c http.extraHeader="$auth" fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q --detach "$GITHUB_SHA"

      - name: Scan
        run: |
          # Image mirrored by scripts/mirror.py (mirror.yaml)
          docker run --rm -v "$PWD:/repo" \
            ${{ env.REGISTRY }}/gitleaks/gitleaks:v8.30.1@sha256:6b2d52241f9d176fc59e6e3b026ea52c98f390070587d9475d6ee2bc64941815 \
            git /repo \
            --config /repo/.gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact --no-banner --verbose

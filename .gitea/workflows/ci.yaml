name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "01-connected-zone/app/**"
      - "01-connected-zone/Dockerfile"
      - ".gitea/workflows/ci.yaml"
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
    paths:
      - "01-connected-zone/app/**"
      - "01-connected-zone/Dockerfile"
  workflow_dispatch:

env:
  REGISTRY: 192.168.2.2:5000
  IMAGE_NAME: lumen-api

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          github-server-url: http://192.168.2.2:30300

      # The migration and store tests need a real PostgreSQL: the image the
      # CNPG cluster runs, already in the registry. Started on the host
      # Docker (the runner's socket), on a random loopback port: the job
      # container uses the host network (gitea-runner/01-runner.yaml).
      - name: Start PostgreSQL
        id: pg
        run: |
          NAME="ci-pg-${{ github.run_id }}"
          docker run -d --rm --name "$NAME" -p 127.0.0.1::5432 \
            -e POSTGRES_PASSWORD=test 192.168.2.2:5000/postgresql:16.6
          PORT=$(docker port "$NAME" 5432/tcp | head -1 | cut -d: -f2)
          for i in $(seq 60); do
            docker exec "$NAME" pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1 && break
            sleep 1
          done
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "dsn=postgres://postgres:test@127.0.0.1:${PORT}/postgres?sslmode=disable" >> "$GITHUB_OUTPUT"

      # The idempotency lock tests need a real Redis (Lua compare-and-delete)
      - name: Start Redis
        id: redis
        run: |
          NAME="ci-redis-${{ github.run_id }}"
          docker run -d --rm --name "$NAME" -p 127.0.0.1::6379 192.168.2.2:5000/redis:7-alpine
          PORT=$(docker port "$NAME" 6379/tcp | head -1 | cut -d: -f2)
          for i in $(seq 30); do
            docker exec "$NAME" redis-cli ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "addr=127.0.0.1:${PORT}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        working-directory: 01-connected-zone/app
        env:
          LUMEN_TEST_PG_DSN: ${{ steps.pg.outputs.dsn }}
          LUMEN_TEST_REDIS_ADDR: ${{ steps.redis.outputs.addr }}
        # -p 1: the migrations and store tests use fixed database and role names.
        # Coverage with the same floor as .github/workflows/checks.yml; -race
        # and golangci-lint run there only: the job image has no cgo, and
        # their images are not mirrored yet (scripts/check/images.sh)
        run: |
          go vet ./...
          go test ./... -v -count=1 -p 1 -coverpkg=./... -coverprofile=cover.out
          ../../scripts/check/coverage.sh cover.out 55

      - name: Stop PostgreSQL
        if: always() && steps.pg.outputs.name != ''
        run: docker stop "${{ steps.pg.outputs.name }}"

      - name: Stop Redis
        if: always() && steps.redis.outputs.name != ''
        run: docker stop "${{ steps.redis.outputs.name }}"

  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          github-server-url: http://192.168.2.2:30300

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            -f 01-connected-zone/Dockerfile \
            01-connected-zone/

      - name: Scan image with Trivy (report)
        run: |
          docker run --rm \
            -v /var/cache/trivy:/root/.cache/trivy \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.REGISTRY }}/aquasec/trivy:0.59.1 \
            image \
            --skip-db-update \
            --skip-java-db-update \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --format table \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"

      - name: Scan image with Trivy (gate)
        run: |
          # Blocks the pipeline on fixable CRITICAL vulnerabilities.
          # --ignore-unfixed: unfixable CVEs are reported above but cannot block
          # (no action possible in airgap). Waivers go in .trivyignore.
          docker run --rm \
            -v /var/cache/trivy:/root/.cache/trivy \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.REGISTRY }}/aquasec/trivy:0.59.1 \
            image \
            --skip-db-update \
            --skip-java-db-update \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"

      - name: Push Docker image
        run: |
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Sign image with Cosign
        run: |
          # Extract cosign binary from the registry image (airgap-safe, no internet)
          docker create --name cosign-extract ${{ env.REGISTRY }}/projectsigstore/cosign:v3.0.5
          docker cp cosign-extract:/ko-app/cosign /usr/local/bin/cosign
          docker rm cosign-extract
          chmod +x /usr/local/bin/cosign
          # Write key and sign (secret is base64-encoded to preserve PEM line breaks)
          echo "${{ secrets.CI_COSIGN_KEY }}" | base64 -d > /tmp/cosign.key
          chmod 600 /tmp/cosign.key
          # --new-bundle-format=false: cosign v3 defaults to the OCI bundle
          # format (sha256-<digest> referrer tag) which Kyverno's keys-based
          # verifyImages cannot read — it needs the legacy sha256-<digest>.sig
          COSIGN_PASSWORD="" cosign sign \
            --key /tmp/cosign.key \
            --allow-http-registry \
            --allow-insecure-registry \
            --tlog-upload=false \
            --use-signing-config=false \
            --new-bundle-format=false \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          rm -f /tmp/cosign.key

      - name: Summary
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          github-server-url: http://192.168.2.2:30300

      - name: Build and push semver image
        run: |
          SEMVER="${{ github.ref_name }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SEMVER}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            -f 01-connected-zone/Dockerfile \
            01-connected-zone/
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SEMVER}"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Sign image with Cosign
        run: |
          SEMVER="${{ github.ref_name }}"
          # Extract cosign binary from the registry image (airgap-safe, no internet)
          docker create --name cosign-extract ${{ env.REGISTRY }}/projectsigstore/cosign:v3.0.5
          docker cp cosign-extract:/ko-app/cosign /usr/local/bin/cosign
          docker rm cosign-extract
          chmod +x /usr/local/bin/cosign
          # Write key and sign (secret is base64-encoded to preserve PEM line breaks)
          echo "${{ secrets.CI_COSIGN_KEY }}" | base64 -d > /tmp/cosign.key
          chmod 600 /tmp/cosign.key
          # --new-bundle-format=false: legacy .sig tag format required by Kyverno
          COSIGN_PASSWORD="" cosign sign \
            --key /tmp/cosign.key \
            --allow-http-registry \
            --allow-insecure-registry \
            --tlog-upload=false \
            --use-signing-config=false \
            --new-bundle-format=false \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SEMVER}"
          rm -f /tmp/cosign.key

      - name: Update manifest
        run: |
          SEMVER="${{ github.ref_name }}"
          MANIFEST="03-airgap-zone/manifests/app/03-lumen-api.yaml"
          git config user.email "ci@airgap.local"
          git config user.name "CI Bot"
          git remote set-url origin "http://gitea-admin:${{ secrets.CI_TOKEN }}@192.168.2.2:30300/lumen/lumen.git"
          sed -i "s|image: 192.168.2.2:5000/lumen-api:.*|image: 192.168.2.2:5000/lumen-api:${SEMVER}|" "${MANIFEST}"
          git add "${MANIFEST}"
          git commit -m "chore: update lumen-api image to ${SEMVER} [skip ci]"
          git push origin HEAD:main

      - name: Summary
        run: |
          SEMVER="${{ github.ref_name }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "### Release pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SEMVER}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> "$GITHUB_STEP_SUMMARY"

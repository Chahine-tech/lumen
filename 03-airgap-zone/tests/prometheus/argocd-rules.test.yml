# promtool unit tests for manifests/kube-prometheus-stack/argocd-rules.yaml
# Run: make test-alert-rules
rule_files: [.rules/argocd-rules.yml]
evaluation_interval: 1m
tests:
  # Healthy: nothing fires
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{name="lumen-app",sync_status="Synced",health_status="Healthy"}'
        values: '1x40'
      - series: 'argocd_app_sync_total{name="lumen-app",phase="Succeeded"}'
        values: '0+1x40'
      - series: 'rollout_info{exported_namespace="lumen",name="lumen-api",phase="Completed"}'
        values: '1x40'
    alert_rule_test:
      - {eval_time: 30m, alertname: ArgoCDAppOutOfSync, exp_alerts: []}
      - {eval_time: 30m, alertname: ArgoCDAppUnhealthy, exp_alerts: []}
      - {eval_time: 30m, alertname: ArgoCDSyncFailed, exp_alerts: []}
      - {eval_time: 30m, alertname: ArgoCDMetricsAbsent, exp_alerts: []}
      - {eval_time: 30m, alertname: RolloutFailed, exp_alerts: []}
      - {eval_time: 30m, alertname: RolloutMetricsAbsent, exp_alerts: []}

  # Out of sync, degraded, a failed sync, a degraded rollout
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{name="lumen-app",sync_status="OutOfSync",health_status="Degraded"}'
        values: '1x40'
      - series: 'argocd_app_sync_total{name="lumen-app",phase="Failed"}'
        values: '0x9 1x30'
      - series: 'rollout_info{exported_namespace="lumen",name="lumen-api",phase="Abort"}'
        values: '1x40'
    alert_rule_test:
      - {eval_time: 10m, alertname: ArgoCDAppOutOfSync, exp_alerts: []}
      - eval_time: 20m
        alertname: ArgoCDAppOutOfSync
        exp_alerts:
          - exp_labels: {severity: warning, service: argocd, name: lumen-app, sync_status: OutOfSync, health_status: Degraded}
            exp_annotations:
              runbook_url: https://gitea.airgap.local/lumen/lumen/src/branch/main/docs/runbooks/alerting.md#argocd-and-rollouts
              summary: An ArgoCD application is out of sync
              description: 'lumen-app is OutOfSync for 15 minutes. Check: kubectl get application -n argocd lumen-app'
      - eval_time: 20m
        alertname: ArgoCDAppUnhealthy
        exp_alerts:
          - exp_labels: {severity: warning, service: argocd, name: lumen-app, sync_status: OutOfSync, health_status: Degraded}
            exp_annotations:
              runbook_url: https://gitea.airgap.local/lumen/lumen/src/branch/main/docs/runbooks/alerting.md#argocd-and-rollouts
              summary: An ArgoCD application is not healthy
              description: "lumen-app is Degraded for 10 minutes. Check: kubectl get application -n argocd lumen-app -o jsonpath='{.status.resources}'"
      - eval_time: 12m
        alertname: ArgoCDSyncFailed
        exp_alerts:
          - exp_labels: {severity: warning, service: argocd, name: lumen-app}
            exp_annotations:
              runbook_url: https://gitea.airgap.local/lumen/lumen/src/branch/main/docs/runbooks/alerting.md#argocd-and-rollouts
              summary: An ArgoCD sync failed
              description: "A sync of lumen-app failed in the last 15 minutes. Check: kubectl get application -n argocd lumen-app -o jsonpath='{.status.operationState.message}'"
      - {eval_time: 30m, alertname: ArgoCDSyncFailed, exp_alerts: []}
      - eval_time: 5m
        alertname: RolloutFailed
        exp_alerts:
          - exp_labels: {severity: warning, service: argo-rollouts, exported_namespace: lumen, name: lumen-api, phase: Abort}
            exp_annotations:
              runbook_url: https://gitea.airgap.local/lumen/lumen/src/branch/main/docs/runbooks/alerting.md#argocd-and-rollouts
              summary: A rollout failed
              description: 'lumen/lumen-api is in phase Abort: the canary was aborted or cannot progress. Check: kubectl argo rollouts get rollout -n lumen lumen-api'

  # The first failed sync of an application: its counter appears at 1
  - interval: 1m
    input_series:
      - series: 'argocd_app_sync_total{name="new-app",phase="Failed"}'
        values: '_x9 1x30'
    alert_rule_test:
      - {eval_time: 8m, alertname: ArgoCDSyncFailed, exp_alerts: []}
      - eval_time: 12m
        alertname: ArgoCDSyncFailed
        exp_alerts:
          - exp_labels: {severity: warning, service: argocd, name: new-app}
            exp_annotations:
              runbook_url: https://gitea.airgap.local/lumen/lumen/src/branch/main/docs/runbooks/alerting.md#argocd-and-rollouts
              summary: An ArgoCD sync failed
              description: "A sync of new-app failed in the last 15 minutes. Check: kubectl get application -n argocd new-app -o jsonpath='{.status.operationState.message}'"
      - {eval_time: 30m, alertname: ArgoCDSyncFailed, exp_alerts: []}

  # Nothing scraped
  - interval: 1m
    input_series:
      - series: 'up{job="other"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ArgoCDMetricsAbsent
        exp_alerts:
          - exp_labels: {severity: warning, service: argocd}
            exp_annotations:
              runbook_url: https://gitea.airgap.local/lumen/lumen/src/branch/main/docs/runbooks/alerting.md#argocd-and-rollouts
              summary: No ArgoCD application metrics
              description: The application controller is down, or Prometheus does not scrape it.
      - eval_time: 20m
        alertname: RolloutMetricsAbsent
        exp_alerts:
          - exp_labels: {severity: warning, service: argo-rollouts}
            exp_annotations:
              runbook_url: https://gitea.airgap.local/lumen/lumen/src/branch/main/docs/runbooks/alerting.md#argocd-and-rollouts
              summary: No Argo Rollouts metrics
              description: The Argo Rollouts controller is down, or Prometheus does not scrape it.

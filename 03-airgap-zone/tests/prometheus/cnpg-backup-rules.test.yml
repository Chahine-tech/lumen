# promtool unit tests for manifests/kube-prometheus-stack/cnpg-backup-rules.yaml
# Run: make test-alert-rules (extracts spec.groups into .rules/ first, since
# promtool reads plain rule files, not PrometheusRule objects).
# Kept outside manifests/: ArgoCD would try to apply this file.
rule_files: [.rules/cnpg-backup-rules.yml]
evaluation_interval: 1m
tests:
  # Base backup 1h old: CNPGBaseBackupTooOld must NOT fire
  - interval: 1m
    input_series:
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="lumen",pod="lumen-db-1"}'
        values: '0+60x200'
      - series: 'barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="lumen",pod="lumen-db-1"}'
        values: '0x200'
    alert_rule_test:
      - {eval_time: 3h, alertname: CNPGBaseBackupTooOld, exp_alerts: []}
      - {eval_time: 3h, alertname: CNPGLastBackupFailed, exp_alerts: []}
      - {eval_time: 3h, alertname: CNPGBackupMetricsAbsent, exp_alerts: []}
  # Last backup at t=0, never renewed: fires after 26h + 15m
  - interval: 1m
    input_series:
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="lumen",pod="lumen-db-1"}'
        values: '0x1800'
    alert_rule_test:
      - {eval_time: 25h, alertname: CNPGBaseBackupTooOld, exp_alerts: []}
      - eval_time: 28h
        alertname: CNPGBaseBackupTooOld
        exp_alerts:
          - exp_labels: {severity: warning, service: lumen-db, namespace: lumen}
            exp_annotations:
              summary: lumen-db has no successful base backup for more than 26 hours
              description: 'Last available base backup is 1d 4h 0m 0s old. Check: kubectl get backup -n lumen --sort-by=.metadata.creationTimestamp'
  # Failure newer than last success
  - interval: 1m
    input_series:
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="lumen",pod="lumen-db-1"}'
        values: '100x30'
      - series: 'barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="lumen",pod="lumen-db-1"}'
        values: '200x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: CNPGLastBackupFailed
        exp_alerts:
          - exp_labels: {severity: warning, service: lumen-db, namespace: lumen}
            exp_annotations:
              summary: The most recent base backup of lumen-db failed
              description: 'Check: kubectl get backup -n lumen and the plugin-barman-cloud container logs of the instance that ran it.'
  # No metric at all for 2h
  - interval: 1m
    input_series:
      - series: 'up{job="other"}'
        values: '1x150'
    alert_rule_test:
      - eval_time: 2h
        alertname: CNPGBackupMetricsAbsent
        exp_alerts:
          - exp_labels: {severity: warning, service: lumen-db, namespace: lumen}
            exp_annotations:
              summary: No backup metrics for lumen-db
              description: Prometheus has no barman_cloud_cloudnative_pg_io_last_available_backup_timestamp for namespace lumen. Either no backup exists or the plugin/scrape is broken.
  # WAL archiving: never failed (-1) vs failing after a success
  - interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="lumen",pod="lumen-db-1"}'
        values: '-1x10 500x30'
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="lumen",pod="lumen-db-1"}'
        values: '100x40'
    alert_rule_test:
      - {eval_time: 9m, alertname: CNPGWALArchivingFailing, exp_alerts: []}
      - eval_time: 30m
        alertname: CNPGWALArchivingFailing
        exp_alerts:
          - exp_labels: {severity: critical, service: lumen-db, namespace: lumen, pod: lumen-db-1}
            exp_annotations:
              summary: WAL archiving is failing on lumen-db-1
              description: The last WAL archive attempt failed and none succeeded since. Point in time recovery stops at the last archived segment, and pg_wal grows on the primary until the volume is full.

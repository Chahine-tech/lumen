# Workloads: the Pod policies apply to their template (autogen)
apiVersion: apps/v1
kind: Deployment
metadata: {name: d-external, namespace: lumen, labels: {app: a, tier: t}}
spec:
  selector: {matchLabels: {k: v}}
  template:
    metadata: {labels: {k: v}}
    spec:
      containers:
        - name: main
          image: "nginx:1.27"
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 50m, memory: 32Mi}}
---
apiVersion: apps/v1
kind: StatefulSet

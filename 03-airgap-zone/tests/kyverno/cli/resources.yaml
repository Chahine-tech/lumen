# Test resources for kyverno-test.yaml: the cases of ../admission-tests.sh,
# evaluated offline by the Kyverno CLI. Names are unique across kinds: the
# results of kyverno-test.yaml refer to them by namespace/name. No
# securityContext: Pod Security admission does not run here.
#
# Pods
apiVersion: v1
kind: Pod
metadata: {name: p-external, namespace: lumen}
spec:
  containers: [{name: main, image: "docker.io/library/nginx:1.27"}]
---

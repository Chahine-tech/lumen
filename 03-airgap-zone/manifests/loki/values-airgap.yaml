# Loki 3.6.5 - Airgap Override Values
# Mode: SingleBinary (monolithic) - single-node K3s
# Storage: filesystem (no S3, no MinIO)

# --- Global image registry override ---
global:
  imageRegistry: 192.168.2.2:5000

# --- Deployment mode ---
deploymentMode: SingleBinary

# --- Loki config ---
loki:
  auth_enabled: false

  # The chart drops the tag when a digest is set (image@digest); the tag
  # still names the version label
  image:
    tag: 3.6.5
    digest: "sha256:f92deafba1587be4cbf5760444c336aca4ced066fbe3bb2211dac5be8d137561"

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem

  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m

  querier:
    max_concurrent: 2

# --- SingleBinary pod ---
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi

# --- Disable ALL other replica groups (required for SingleBinary) ---
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

# --- Gateway (nginx) - override image registry ---
gateway:
  enabled: true
  replicas: 1
  image:
    registry: 192.168.2.2:5000
    repository: nginxinc/nginx-unprivileged
    tag: 1.29.8-alpine
    # The chart drops the tag when a digest is set (image@digest)
    digest: "sha256:e7726cdbcdc432fc8c0b94a227908085ac77f0f27141e790caaae496ceb104c0"
    pullPolicy: IfNotPresent

# --- Disable memcached (not needed for single-node) ---
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# --- Disable lokiCanary (requires external images) ---
lokiCanary:
  enabled: false

# --- Disable MinIO (using filesystem) ---
minio:
  enabled: false

# --- Disable helm test ---
test:
  enabled: false

# --- Config sidecar, pinned to its digest (image@sha256:...) ---
sidecar:
  image:
    sha: "2b958e416a804adbbf8fb71e9c811f06f9298e241db048f72343ed8ef6eb96aa"

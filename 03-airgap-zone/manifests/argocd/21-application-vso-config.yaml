apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vso-config
  namespace: argocd
  annotations:
    # Wave 10: after VSO operator (9) and vault (earlier) — these CRs need both
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Gap found during the July 2026 deployment: manifests/vso/ (VaultConnection,
  # VaultAuth, VaultStaticSecrets for lumen) was applied manually and synced by
  # no Application. This app brings it under GitOps; existing CRs are adopted.
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/lumen/lumen.git
    targetRevision: HEAD
    path: 03-airgap-zone/manifests/vso

  destination:
    server: https://kubernetes.default.svc
    namespace: lumen

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

# No Pod may run as a ServiceAccount that only exists to log in to Vault
# (issue #6)
#
# The Vault roles of VSO and cert-manager are bound to dedicated
# ServiceAccounts (*-vso, cert-manager-vault-auth). VSO and cert-manager
# request tokens for them through the TokenRequest API; no Pod runs as them.
# Without this policy, anyone allowed to create a Pod in the namespace could
# set serviceAccountName to one of them and read the secrets its role reads.
#
# Every namespace the Kyverno webhook sees (all but kube-system and kyverno),
# with the failurePolicy and autogen choices of 02-require-internal-registry.yaml.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: lumen-restrict-vault-serviceaccounts
  annotations:
    policies.kyverno.io/title: No Pod as a Vault-only ServiceAccount
    policies.kyverno.io/category: Secrets
spec:
  validationActions: [Deny]
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  variables:
    - name: sa
      expression: object.spec.?serviceAccountName.orValue('default')
  validations:
    - expression: >-
        !(variables.sa.endsWith('-vso') || variables.sa == 'cert-manager-vault-auth')
      messageExpression: >-
        'ServiceAccount ' + variables.sa + ' is for Vault logins only (VSO,
        cert-manager): no Pod may run as it'

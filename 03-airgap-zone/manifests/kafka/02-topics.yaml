# The events of lumen-api, published from its outbox (issue #44). PostgreSQL
# stays the source of truth: the topic can be rebuilt from it.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: lumen.events
  namespace: kafka
  labels:
    strimzi.io/cluster: lumen
spec:
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: 2
    retention.ms: 604800000  # 7 days
    cleanup.policy: delete

# Grafana admin credentials — synced from Vault by VSO
#
# Replaces the hardcoded `adminPassword: admin` that used to live in
# values-airgap-override.yaml. Source of truth: Vault KV v2 at lumen/grafana
# (keys admin-user / admin-password), seeded by 03-airgap-zone/scripts/vault-configure.sh.
# The chart reads them via grafana.admin.existingSecret.

---
# VSO requests its tokens (audience vault); no pod runs as it (issue #6)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-admin-vso
  namespace: monitoring
automountServiceAccountToken: false

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault-connection
  namespace: monitoring
spec:
  address: https://vault.vault.svc.cluster.local:8200
  skipTLSVerify: false
  # Root of the infrastructure CA, kept by cert-manager (vault/06-vault-tls.yaml)
  caCertSecretRef: vault-ca

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: monitoring-vault-auth
  namespace: monitoring
spec:
  vaultConnectionRef: vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: grafana-admin
    serviceAccount: grafana-admin-vso
    audiences:
      - vault

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  vaultAuthRef: monitoring-vault-auth
  type: kv-v2
  mount: lumen
  path: grafana
  destination:
    name: grafana-admin-vault   # referenced by grafana.admin.existingSecret
    create: true
  refreshAfter: 1h

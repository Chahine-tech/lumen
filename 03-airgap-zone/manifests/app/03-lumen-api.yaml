apiVersion: v1
kind: ConfigMap
metadata:
  name: lumen-api-config
  namespace: lumen
data:
  REDIS_ADDR: "redis:6379"
  REDIS_MODE: "sentinel"
  REDIS_SENTINEL_ADDRS: "redis-sentinel.lumen.svc.cluster.local:26379"
  REDIS_MASTER_NAME: "mymaster"
  PORT: "8080"
  # PostgreSQL - read/write splitting via CNPG services
  # Credentials from Secret lumen-db-vault (managed by VSO from Vault KV lumen/db)
  PG_RW_HOST: "lumen-db-rw.lumen.svc.cluster.local"
  PG_RO_HOST: "lumen-db-ro.lumen.svc.cluster.local"
  PG_DBNAME: "app"

---
apiVersion: v1
kind: Service
metadata:
  name: lumen-api
  namespace: lumen
  labels:
    app: lumen-api
    tier: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    # /metrics and pprof (off by default), not routed by Traefik, scraped
    # by the ServiceMonitor: docs/runbooks/lumen-api-admin-port.md
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: admin
  selector:
    app: lumen-api

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lumen-api-pdb
  namespace: lumen
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: lumen-api

---
# Service stable — receives main traffic (managed by Argo Rollouts)
apiVersion: v1
kind: Service
metadata:
  name: lumen-api-stable
  namespace: lumen
  labels:
    app: lumen-api
    tier: backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: lumen-api

---
# Service canary — receives canary traffic (managed by Argo Rollouts)
apiVersion: v1
kind: Service
metadata:
  name: lumen-api-canary
  namespace: lumen
  labels:
    app: lumen-api
    tier: backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: lumen-api

---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: lumen-api
  namespace: lumen
  labels:
    app: lumen-api
    tier: backend
    version: v1.7.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lumen-api
  template:
    metadata:
      labels:
        app: lumen-api
        tier: backend
        version: v1.7.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # Above the app's 30s shutdown budget (drain delay + in-flight requests)
      terminationGracePeriodSeconds: 45
      containers:
        - name: lumen-api
          image: 192.168.2.2:5000/lumen-api:v1.7.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9090
              name: admin
              protocol: TCP
          env:
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: lumen-api-config
                  key: REDIS_ADDR
            - name: REDIS_MODE
              valueFrom:
                configMapKeyRef:
                  name: lumen-api-config
                  key: REDIS_MODE
            - name: REDIS_SENTINEL_ADDRS
              valueFrom:
                configMapKeyRef:
                  name: lumen-api-config
                  key: REDIS_SENTINEL_ADDRS
            - name: REDIS_MASTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: lumen-api-config
                  key: REDIS_MASTER_NAME
            # Redis password — Secret synced by VSO from Vault KV lumen/redis
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumen-redis-vault
                  key: password
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: lumen-api-config
                  key: PORT
            - name: TEMPO_ENDPOINT
              value: "http://tempo.monitoring.svc.cluster.local:4318"
            # PostgreSQL DSNs (read/write splitting), as lumen_runtime: DML
            # only. The schema is migrated by the PreSync Job below, as the
            # owner. Secret lumen-db-runtime: VSO, from Vault KV
            # lumen/db-runtime (docs/runbooks/database-migrations.md)
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumen-db-runtime
                  key: password
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: lumen-db-runtime
                  key: username
            - name: PG_DBNAME
              valueFrom:
                configMapKeyRef:
                  name: lumen-api-config
                  key: PG_DBNAME
            - name: PG_RW_DSN
              value: "postgresql://$(PG_USER):$(PG_PASSWORD)@lumen-db-rw.lumen.svc.cluster.local:5432/$(PG_DBNAME)"
            - name: PG_RO_DSN
              value: "postgresql://$(PG_USER):$(PG_PASSWORD)@lumen-db-ro.lumen.svc.cluster.local:5432/$(PG_DBNAME)"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          # The probes do not depend on Redis or PostgreSQL: /health checks
          # them, so a short outage of either restarted or unreadied every
          # pod at once (k3d test, Redis down 130s: 8 restarts and 0/2 ready
          # with /health, 0 restarts and 2/2 ready with these).
          # docs/architecture.md, "Probes and shutdown"
          startupProbe:
            httpGet:
              path: /livez
              port: 8080
            periodSeconds: 2
            failureThreshold: 30     # up to 60s: Redis and PostgreSQL are retried for 30s at startup
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 2
            # 503 from SIGTERM: the pod leaves the Service within ~2s, the
            # app drains 5s more
            failureThreshold: 1
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
  strategy:
    canary:
      stableService: lumen-api-stable
      canaryService: lumen-api-canary
      steps:
        - setWeight: 20   # 20% canary, 80% stable
        - analysis:       # smoke test against the canary pods (06-smoke-test-analysis.yaml)
            templates:
              - templateName: smoke-test
        - analysis:       # auto-rollback if success rate < 95% for 3 consecutive checks
            templates:
              - templateName: success-rate
        - setWeight: 80   # 80% canary, 20% stable
        - analysis:       # second check before full promotion
            templates:
              - templateName: success-rate
        - setWeight: 100  # full promotion

---
# Schema migration, before every sync of lumen-app: ArgoCD runs this PreSync
# hook and applies the Rollout only once it has succeeded.
# docs/runbooks/database-migrations.md
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lumen-db-migrate
  namespace: lumen
automountServiceAccountToken: false

---
apiVersion: batch/v1
kind: Job
metadata:
  name: lumen-db-migrate
  namespace: lumen
  labels:
    app: lumen-db-migrate
    tier: backend
  annotations:
    argocd.argoproj.io/hook: PreSync
    # Keep the last Job (and its logs) until the next sync replaces it
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0             # a failed migration fails the sync; ArgoCD retries the sync
  activeDeadlineSeconds: 600  # the advisory lock waits up to 5 min for another run
  template:
    metadata:
      labels:
        app: lumen-db-migrate   # not lumen-api: kept out of the Services and the PDB
        tier: backend
    spec:
      serviceAccountName: lumen-db-migrate
      restartPolicy: Never
      containers:
        - name: migrate
          # Same image as the Rollout (see above)
          image: 192.168.2.2:5000/lumen-api:v1.7.0
          args: ["migrate"]
          env:
            # Owner of the database (Vault lumen/db)
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: lumen-db-vault
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumen-db-vault
                  key: password
            - name: PG_DBNAME
              valueFrom:
                secretKeyRef:
                  name: lumen-db-vault
                  key: dbname
            - name: PG_MIGRATE_DSN
              value: "postgresql://$(PG_USER):$(PG_PASSWORD)@lumen-db-rw.lumen.svc.cluster.local:5432/$(PG_DBNAME)"
            - name: PG_RUNTIME_ROLE
              value: lumen_runtime
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

# Vault HA Helm values — airgap configuration
# HashiCorp Vault 1.19.0 — Raft HA (3 replicas)
# All images served from internal registry 192.168.2.2:5000
#
# Architecture:
#   - 3 Vault pods (Raft consensus, no external storage)
#   - Vault Agent Injector (MutatingWebhookConfiguration)
#   - TLS on the listener and Raft joins (issue #5): certificate from the
#     infrastructure CA, vault/06-vault-tls.yaml, docs/runbooks/vault-tls.md
#   - UI accessible via vault.airgap.local (Traefik re-encrypts to Vault)

global:
  enabled: true
  # https in VAULT_ADDR, the probes and the Service port names
  tlsDisable: false

# ─────────────────────────────────────────────
# Vault Agent Injector
# Injects vault-agent sidecar into annotated pods
# ─────────────────────────────────────────────
injector:
  enabled: true

  image:
    repository: 192.168.2.2:5000/hashicorp/vault-k8s
    tag: "1.6.2@sha256:ba8755fa2e6f26c14464a3852cf31485ddd8acea7d06f3c47eccfe38c71c0248"
    pullPolicy: IfNotPresent

  agentImage:
    repository: 192.168.2.2:5000/hashicorp/vault
    tag: "1.19.0@sha256:c53c28cbb630af36f5e56812691fd4e6d5a3ccdf3bccf9aa4cce3f1c4ec26be2"

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Webhook configuration
  failurePolicy: Ignore  # Don't block pod creation if injector is down

# ─────────────────────────────────────────────
# Vault Server — HA with Raft storage
# ─────────────────────────────────────────────
server:
  image:
    repository: 192.168.2.2:5000/hashicorp/vault
    tag: "1.19.0@sha256:c53c28cbb630af36f5e56812691fd4e6d5a3ccdf3bccf9aa4cce3f1c4ec26be2"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Listener certificate and the root that verifies it (Secret
  # vault-server-tls, vault/06-vault-tls.yaml), at
  # /vault/userconfig/vault-server-tls. VAULT_CACERT lets the vault CLI in
  # the pods (kubectl exec) verify https://127.0.0.1:8200.
  extraVolumes:
    - type: secret
      name: vault-server-tls
  extraEnvironmentVars:
    VAULT_CACERT: /vault/userconfig/vault-server-tls/ca.crt

  # Persistent storage for Raft data
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: local-path
    accessMode: ReadWriteOnce

  # Readiness probe — Vault is ready only when unsealed
  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true"

  # HA configuration with Raft integrated storage
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true

      config: |
        cluster_name = "lumen-vault"

        storage "raft" {
          path    = "/vault/data"

          retry_join {
            leader_api_addr     = "https://vault-0.vault-internal:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-server-tls/ca.crt"
          }
          retry_join {
            leader_api_addr     = "https://vault-1.vault-internal:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-server-tls/ca.crt"
          }
          retry_join {
            leader_api_addr     = "https://vault-2.vault-internal:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-server-tls/ca.crt"
          }
        }

        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file   = "/vault/userconfig/vault-server-tls/tls.crt"
          tls_key_file    = "/vault/userconfig/vault-server-tls/tls.key"
          tls_min_version = "tls12"
        }

        # Register with Kubernetes for health checks
        service_registration "kubernetes" {}

        # Enable Vault Web UI
        ui = true

        # Audit logging
        # audit "file" {
        #   path = "file"
        #   file_path = "/vault/audit/audit.log"
        # }

  # Anti-affinity: spread pods across nodes
  affinity: |
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vault
                component: server
            topologyKey: kubernetes.io/hostname

  # NetworkPolicy managed by our own manifests (16-allow-vault.yaml)
  networkPolicy:
    enabled: false
    egress: []
    ingress: []

  serviceAccount:
    create: true
    name: vault

# ─────────────────────────────────────────────
# Vault UI — accessible via Traefik IngressRoute
# ─────────────────────────────────────────────
ui:
  enabled: true
  serviceType: ClusterIP
  servicePort: 8200

argo-rollouts:
  controller:
    image:
      registry: 192.168.2.2:5000
      repository: argoproj/argo-rollouts
      tag: "v1.8.0@sha256:b61ca80d5e094fbfdfa088095cab1b49e8dbeca83b8111bc7d3a651c8c6f3a7d"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    # Rollout phases, for kube-prometheus-stack/argocd-rules.yaml (issue #25)
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  dashboard:
    enabled: true
    image:
      registry: 192.168.2.2:5000
      repository: argoproj/argo-rollouts
      tag: "v1.8.0@sha256:b61ca80d5e094fbfdfa088095cab1b49e8dbeca83b8111bc7d3a651c8c6f3a7d"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  installCRDs: true

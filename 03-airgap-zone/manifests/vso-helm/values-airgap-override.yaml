# Vault Secrets Operator — airgap overrides
# All images from local registry 192.168.2.2:5000

controller:
  manager:
    image:
      repository: 192.168.2.2:5000/hashicorp/vault-secrets-operator
      tag: "1.3.0@sha256:3fbc8e3c0482462e716d5343e034dd02a1c2b791ce79a90410860d11dbd4ec15"
  kubeRbacProxy:
    image:
      repository: 192.168.2.2:5000/brancz/kube-rbac-proxy
      tag: "v0.18.1@sha256:f62865289ccf45633f80a5a4e30fb86a704a2dd2ad84aa683faa45a32f74c2cf"

  # Default VaultConnection for all VaultAuth resources in the cluster
  defaultVaultConnection:
    enabled: true
    address: "http://vault.vault.svc.cluster.local:8200"
    skipTLSVerify: false

  # Default VaultAuth using Kubernetes auth method
  defaultAuthMethod:
    enabled: true
    namespace: lumen
    method: kubernetes
    mount: kubernetes
    kubernetes:
      role: lumen-api
      serviceAccount: default
      tokenAudiences:
        - vault

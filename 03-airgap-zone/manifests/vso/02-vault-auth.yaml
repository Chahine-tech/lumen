# VaultAuth: how VSO authenticates to Vault on behalf of the lumen namespace,
# for the Redis password and the PostgreSQL runtime credentials. The Vault
# role lumen-api is bound to the dedicated ServiceAccount lumen-vso only
# (issue #6): a pod running as `default` in lumen cannot log in with it.
# VSO requests its tokens (audience vault); no pod runs as it
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lumen-vso
  namespace: lumen
automountServiceAccountToken: false

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: lumen-vault-auth
  namespace: lumen
spec:
  vaultConnectionRef: vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: lumen-api
    serviceAccount: lumen-vso
    audiences:
      - vault

# PostgreSQL credentials, synced by VSO from Vault KV v2
#
# Two roles (docs/runbooks/database-migrations.md):
#   lumen/db          app, owner of the database: runs the migrations
#                     (seeded from the CNPG Secret lumen-db-app)
#   lumen/db-runtime  lumen_runtime, DML only: what lumen-api runs as
#                     (password generated by the vault-init Job; the role is
#                     a CNPG managed role, cnpg/02-cluster.yaml)
#
# The owner credentials go through a dedicated ServiceAccount and Vault role:
# a pod running as `default` in lumen (lumen-vault-auth) can read the runtime
# credentials but not the owner's.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lumen-db-owner-vso
  namespace: lumen
automountServiceAccountToken: false

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: lumen-db-owner-vault-auth
  namespace: lumen
spec:
  vaultConnectionRef: vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: lumen-db-owner
    serviceAccount: lumen-db-owner-vso
    audiences:
      - vault

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: lumen-db-credentials
  namespace: lumen
spec:
  vaultAuthRef: lumen-db-owner-vault-auth
  type: kv-v2
  mount: lumen
  path: db
  destination:
    name: lumen-db-vault   # used by the migration Job (and by lumen-api up to v1.6.0)
    create: true
  refreshAfter: 1h

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: lumen-db-runtime-credentials
  namespace: lumen
spec:
  vaultAuthRef: lumen-vault-auth
  type: kv-v2
  mount: lumen
  path: db-runtime
  destination:
    name: lumen-db-runtime
    create: true
    # Format CNPG expects for a managed role's passwordSecret (keys username
    # and password). With the label, CNPG watches the Secret and applies a
    # password change without waiting for a later reconciliation (measured
    # on k3d, CNPG 1.30.1: 70s from the Secret change to PostgreSQL).
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
  refreshAfter: 1h

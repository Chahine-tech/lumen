# PostgreSQL runtime credentials for the outbox relay and the event consumer
# (issue #44), synced by VSO from Vault lumen/db-runtime into the kafka
# namespace, where their client certificates are.
#
# No Pod may run as the ServiceAccount below
# (kyverno-policies/06-restrict-vault-serviceaccounts.yaml, issue #6).
# Only its ca.crt is used, the root of the infrastructure CA, as for the other
# namespaces (vault/06-vault-tls.yaml). Here because the kafka namespace comes
# from ArgoCD, after that file is applied.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ca
  namespace: kafka
spec:
  secretName: vault-ca
  issuerRef:
    name: infra-ca
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
  duration: 8760h
  renewBefore: 720h
  usages: [email protection]
  commonName: vault-ca-bundle

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault-connection
  namespace: kafka
spec:
  address: https://vault.vault.svc.cluster.local:8200
  skipTLSVerify: false
  caCertSecretRef: vault-ca

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-workers-vso
  namespace: kafka
automountServiceAccountToken: false

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: kafka-workers-vault-auth
  namespace: kafka
spec:
  vaultConnectionRef: vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: kafka-workers
    serviceAccount: kafka-workers-vso
    audiences:
      - vault

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: lumen-db-runtime-credentials
  namespace: kafka
spec:
  vaultAuthRef: kafka-workers-vault-auth
  type: kv-v2
  mount: lumen
  path: db-runtime
  destination:
    name: lumen-db-runtime
    create: true
  refreshAfter: 1h
  # A rotated password reaches the workers at their next start
  rolloutRestartTargets:
    - kind: Deployment
      name: lumen-outbox-relay
    - kind: Deployment
      name: lumen-events-consumer

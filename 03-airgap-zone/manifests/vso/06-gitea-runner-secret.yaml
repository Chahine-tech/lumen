# Gitea Actions runner registration token, synced from Vault
#
# Source of truth: Vault KV v2 at lumen/gitea-runner, key `token`. Seeded by
# scripts/seed-gitea-runner-token.sh (generated by Gitea, piped to Vault).
# Consumed by the runner Deployment (manifests/gitea-runner/01-runner.yaml)
# as Secret gitea-runner-token, key `token`.
#
# The token used to be written in clear in 01-runner.yaml (public repository,
# issue #1). Dedicated ServiceAccount and Vault role: nothing else in the
# gitea namespace can read it.

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault-connection
  namespace: gitea
spec:
  address: http://vault.vault.svc.cluster.local:8200
  skipTLSVerify: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-runner-vso
  namespace: gitea
automountServiceAccountToken: false

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: gitea-runner-vault-auth
  namespace: gitea
spec:
  vaultConnectionRef: vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: gitea-runner
    serviceAccount: gitea-runner-vso
    audiences:
      - vault

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gitea-runner-token
  namespace: gitea
spec:
  vaultAuthRef: gitea-runner-vault-auth
  type: kv-v2
  mount: lumen
  path: gitea-runner
  destination:
    name: gitea-runner-token   # referenced by the runner Deployment
    create: true
    # The Secret already exists on clusters built before this change (it was
    # applied from 01-runner.yaml): without overwrite, VSO refuses to take it
    # over ("useful when migrating to VSO", CRD description, VSO 1.3.0)
    overwrite: true
  refreshAfter: 1h

# S3 credentials for the PostgreSQL backups (Barman Cloud plugin → Garage)
#
# Source of truth: Vault KV v2 at lumen/cnpg-backup, keys ACCESS_KEY_ID,
# ACCESS_SECRET_KEY, REGION. Seeded from Garage by
# scripts/seed-cnpg-backup-creds.sh. Consumed by the ObjectStore
# lumen-backups (manifests/cnpg/06-object-store.yaml).
#
# Dedicated ServiceAccount and Vault role instead of the namespace `default`
# ServiceAccount used by lumen-vault-auth: a pod running as `default` in lumen
# cannot read the backup credentials (and so cannot delete the backups).

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-backup-vso
  namespace: lumen
automountServiceAccountToken: false

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: cnpg-backup-vault-auth
  namespace: lumen
spec:
  vaultConnectionRef: vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: cnpg-backup
    serviceAccount: cnpg-backup-vso
    audiences:
      - vault

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: lumen-db-backup-credentials
  namespace: lumen
spec:
  vaultAuthRef: cnpg-backup-vault-auth
  type: kv-v2
  mount: lumen
  path: cnpg-backup
  destination:
    name: lumen-db-backup-s3   # referenced by the ObjectStore lumen-backups
    create: true
  refreshAfter: 1h

# Allow Prometheus to scrape lumen-api
#
# 9090 only: the admin port (/metrics, and pprof when PPROF_ENABLED=true).
# Up to v1.6.0 /metrics was on 8080, which Prometheus no longer reaches:
# docs/runbooks/lumen-api-admin-port.md
#
# kubernetes.io/metadata.name is set by Kubernetes on every namespace; the
# `name: monitoring` label used before only exists if
# deploy-kube-prometheus-stack.sh ran.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: lumen
  annotations:
    description: "Allow Prometheus (kube-prometheus-stack) to scrape metrics from lumen-api"
spec:
  podSelector:
    matchLabels:
      app: lumen-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090

# lumen-api port 8080 (the API): from Traefik only
#
# Before: from every namespace, so any pod in the cluster reached the API
# (and pprof) without going through Traefik and its mTLS. Prometheus has its
# own policy (05-allow-monitoring.yaml); the kubelet probes are not subject
# to NetworkPolicies.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: lumen
  annotations:
    description: "Allow Traefik to reach lumen-api on port 8080"
spec:
  podSelector:
    matchLabels:
      app: lumen-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080

---
# Allow API to make egress to Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress-to-redis
  namespace: lumen
  annotations:
    description: "Allow lumen-api to connect to Redis"
spec:
  podSelector:
    matchLabels:
      app: lumen-api
  policyTypes:
    - Egress
  egress:
    # To Redis master/replica (port 6379) and sentinels (port 26379)
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379

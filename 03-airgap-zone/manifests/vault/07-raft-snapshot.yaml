# Daily Raft snapshot of Vault, copied to Garage on backup-1, off the Vault
# volumes (issue #4). docs/runbooks/vault-audit-snapshots.md
#
#   snapshot (vault)  Kubernetes auth as vault-snapshot (role raft-snapshot,
#                     scripts/vault-configure.sh), `vault operator raft
#                     snapshot save`, and the Garage key from lumen/vault-snapshot
#   upload (rclone)   copies it to s3://lumen-vault-snapshots, deletes the
#                     snapshots older than 30 days
#
# The snapshot holds Vault's storage as is, encrypted by the barrier: a
# restore needs this Vault's seal (the transit key, issue #3).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-snapshot
  namespace: vault
automountServiceAccountToken: false

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-raft-snapshot
  namespace: vault
spec:
  schedule: "30 2 * * *"         # 02:30 UTC, after the PostgreSQL backup (02:00)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: vault-raft-snapshot
        spec:
          serviceAccountName: vault-snapshot
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: vault
                      expirationSeconds: 600
            - name: vault-ca
              secret:
                secretName: vault-server-tls
                items:
                  - key: ca.crt
                    path: ca.crt
            # The snapshot and the Garage key, for this pod only
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
          initContainers:
            - name: snapshot
              image: 192.168.2.2:5000/hashicorp/vault:1.19.0@sha256:c53c28cbb630af36f5e56812691fd4e6d5a3ccdf3bccf9aa4cce3f1c4ec26be2
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  # A new pod has no network until kube-router has
                  # programmed its NetworkPolicies: retried for 30s
                  # (measured on k3d: connection refused at once)
                  for i in $(seq 15); do
                    VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                      role=raft-snapshot jwt=@/var/run/secrets/vault/token) && break
                    [ "$i" -lt 15 ] || exit 1
                    sleep 2
                  done
                  export VAULT_TOKEN
                  name="vault-$(date -u +%Y%m%dT%H%M%SZ).snap"
                  vault operator raft snapshot save "/work/$name"
                  [ -s "/work/$name" ] || { echo "empty snapshot" >&2; exit 1; }
                  echo "$name" > /work/name
                  umask 077
                  vault kv get -format=json lumen/vault-snapshot | sed -n \
                    -e 's/^ *"ACCESS_KEY_ID": "\(.*\)",*$/RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID=\1/p' \
                    -e 's/^ *"ACCESS_SECRET_KEY": "\(.*\)",*$/RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY=\1/p' \
                    -e 's/^ *"REGION": "\(.*\)",*$/RCLONE_CONFIG_GARAGE_REGION=\1/p' > /work/s3.env
                  [ "$(wc -l < /work/s3.env)" -eq 3 ] || { echo "lumen/vault-snapshot incomplete" >&2; exit 1; }
                  vault token revoke -self
                  echo "Snapshot $name: $(wc -c < "/work/$name") bytes"
              env:
                # The active node serves the snapshot
                - name: VAULT_ADDR
                  value: https://vault-active.vault.svc.cluster.local:8200
                - name: VAULT_CACERT
                  value: /etc/vault-ca/ca.crt
              volumeMounts:
                - name: token
                  mountPath: /var/run/secrets/vault
                  readOnly: true
                - name: vault-ca
                  mountPath: /etc/vault-ca
                  readOnly: true
                - name: work
                  mountPath: /work
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 500m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
          containers:
            - name: upload
              image: 192.168.2.2:5000/rclone/rclone:1.75.2@sha256:1fd40f8c4587cb9dc86558d979d62087005df03b7fae6b5bdb9168707ef72725
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  set -a; . /work/s3.env; set +a
                  rclone copyto "/work/$(cat /work/name)" "garage:$BUCKET/$(cat /work/name)"
                  rclone lsl "garage:$BUCKET/$(cat /work/name)"
                  rclone delete --min-age "$KEEP" "garage:$BUCKET"
                  echo "Snapshots in $BUCKET: $(rclone lsf "garage:$BUCKET" | wc -l)"
              env:
                - name: BUCKET
                  value: lumen-vault-snapshots
                - name: KEEP
                  value: 30d
                # Garage on backup-1, as for the PostgreSQL backups
                # (cnpg/06-object-store.yaml)
                - name: RCLONE_CONFIG_GARAGE_TYPE
                  value: s3
                - name: RCLONE_CONFIG_GARAGE_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_GARAGE_ENDPOINT
                  value: http://192.168.2.4:3900
                - name: RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE
                  value: "true"
                # No config file: rclone would try to write one
                - name: RCLONE_CONFIG
                  value: /dev/null
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 500m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]

---
# Egress of the snapshot pods: Vault (same namespace) and Garage on
# backup-1. DNS: 16-allow-vault.yaml covers every pod of the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-raft-snapshot-egress
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app: vault-raft-snapshot
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
              component: server
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - ipBlock:
            cidr: 192.168.2.4/32
      ports:
        - protocol: TCP
          port: 3900

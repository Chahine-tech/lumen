# cert-manager ClusterIssuer backed by Vault PKI Engine
#
# Flow:
#   cert-manager → authenticates to Vault via Kubernetes auth
#               → requests cert from pki/sign/airgap-role
#               → Vault signs with CA imported from airgap-ca ConfigMap
#               → cert-manager stores result as K8s Secret airgap-tls
#
# Prerequisites:
#   - Vault initialized and unsealed
#   - vault-bootstrap.sh init done (PKI engine + K8s auth configured)
#   - cert-manager deployed

---
# ServiceAccount cert-manager authenticates to Vault as. No long-lived token
# Secret (issue #6): cert-manager requests a short-lived token for it at
# each login (serviceAccountRef below)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-vault-auth
  namespace: cert-manager
automountServiceAccountToken: false

---
# Lets cert-manager's controller request tokens for that ServiceAccount only
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-vault-token-request
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["cert-manager-vault-auth"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-vault-token-request
  namespace: cert-manager
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
roleRef:
  kind: Role
  name: cert-manager-vault-token-request
  apiGroup: rbac.authorization.k8s.io

---
# ClusterIssuer: cert-manager issues certs via Vault PKI
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer
spec:
  vault:
    server: https://vault.vault.svc.cluster.local:8200
    # Root of the infrastructure CA, in the cert-manager namespace
    # (vault/06-vault-tls.yaml)
    caBundleSecretRef:
      name: vault-ca
      key: ca.crt
    path: pki/sign/airgap-role
    auth:
      kubernetes:
        role: cert-manager
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: cert-manager-vault-auth
          # cert-manager always adds its own audience (the issuer's name);
          # the Vault role requires vault
          audiences:
            - vault

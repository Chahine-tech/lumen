apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    name: vault
    environment: airgap

---
# No token in the pods that run as the default ServiceAccount: none of them
# calls the Kubernetes API, and no Vault role accepts it (issue #6)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: vault
automountServiceAccountToken: false
